name: link check

# Re-resolves every arXiv identifier through the arXiv API, compares the
# returned title with the entry's own, and requests every other link.
#
# A pull request's Markdown is checked, but never its code: the script that
# does the checking comes from this repository's default branch, and the pull
# request is checked out into a separate directory that is only read.

on:
  pull_request:
    paths:
      - "**/*.md"
      - ".github/scripts/check_links.py"
      - ".github/workflows/link-check.yml"
  schedule:
    - cron: "0 6 1 * *"   # monthly, alongside the review pass
  workflow_dispatch:

permissions:
  contents: read

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the default branch (trusted scripts)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Check out the content under test
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          path: subject
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      - run: python .github/scripts/check_links.py --root subject
