<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-label="Awesome Self-Evolving Agents. Concentric layers an agent has learned to rewrite, outermost first: its prompts (2023), its memory (2023), its workflow (2024), its own code (2025), its harness (2026), its training (2026), and at the centre the process that improves it (2026).">
<rect width="1200" height="400" fill="#0d1117"/>
<g font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
