<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="345" viewBox="0 0 1040 345" role="img" aria-label="(a) The misevolution loop: the agent approves a refund, the customer rates it five stars, the agent learns that approving is good, its approval bias rises, and the loop repeats until bad requests are approved too. (b) In a simulation with no defense, utility stays near 1 while safety falls to 0 within about 500 interactions. (c) Three 2025-26 papers observed the loop in real agents.">
<rect width="1040" height="345" fill="#0d1117"/>
<g font-family="Helvetica,Arial,sans-serif">
<defs><marker id="ar-dark" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9z" fill="#8b949e"/></marker></defs>
<defs><marker id="br-dark" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9z" fill="#ff7b72"/></marker></defs>
<rect x="30" y="30" width="150" height="52" rx="6" fill="#122540" stroke="#3987e5" stroke-width="1.5"/>
<text x="105.0" y="53.0" font-size="13.5" fill="#e6edf3" text-anchor="middle">Agent approves</text>
<text x="105.0" y="69.0" font-size="13.5" fill="#e6edf3" text-anchor="middle">a refund</text>
<rect x="220" y="30" width="150" height="52" rx="6" fill="#122540" stroke="#3987e5" stroke-width="1.5"/>
<text x="295.0" y="53.0" font-size="13.5" fill="#e6edf3" text-anchor="middle">Customer rates</text>
<text x="295.0" y="69.0" font-size="13.5" fill="#e6edf3" text-anchor="middle">it 5 stars</text>
<rect x="220" y="150" width="150" height="52" rx="6" fill="#2e2410" stroke="#d29922" stroke-width="1.5"/>
<text x="295.0" y="173.0" font-size="13.5" fill="#e6edf3" text-anchor="middle">Agent learns</text>
<text x="295.0" y="189.0" font-size="13.5" fill="#e6edf3" text-anchor="middle">“approving is good”</text>
<rect x="30" y="150" width="150" height="52" rx="6" fill="#2e2410" stroke="#d29922" stroke-width="1.5"/>
<text x="105.0" y="173.0" font-size="13.5" fill="#e6edf3" text-anchor="middle">Approval bias</text>
<text x="105.0" y="189.0" font-size="13.5" fill="#e6edf3" text-anchor="middle">rises</text>
<path d="M182 56.0 L216 56.0" stroke="#8b949e" stroke-width="1.6" marker-end="url(#ar-dark)"/>
<path d="M295.0 84 L295.0 146" stroke="#8b949e" stroke-width="1.6" marker-end="url(#ar-dark)"/>
<path d="M218 176.0 L184 176.0" stroke="#8b949e" stroke-width="1.6" marker-end="url(#ar-dark)"/>
<path d="M105.0 148 L105.0 86" stroke="#8b949e" stroke-width="1.6" marker-end="url(#ar-dark)"/>
<text x="113.0" y="120.0" font-size="12" fill="#9198a1">repeat</text>
<path d="M105.0 204 L105.0 246" stroke="#ff7b72" stroke-width="1.6" marker-end="url(#br-dark)"/>
<rect x="30" y="250" width="150" height="52" rx="6" fill="#3a1618" stroke="#ff7b72" stroke-width="1.5"/>
<text x="105.0" y="273.0" font-size="13.5" fill="#e6edf3" text-anchor="middle">Bad requests</text>
<text x="105.0" y="289.0" font-size="13.5" fill="#e6edf3" text-anchor="middle">approved too</text>
<path d="M470 40 V260 H700" fill="none" stroke="#8b949e" stroke-width="1"/>
<path d="M466 260.0 H470" stroke="#8b949e"/>
<text x="462.0" y="264.0" font-size="11.5" fill="#9198a1" text-anchor="end">0</text>
<path d="M466 158.8 H470" stroke="#8b949e"/>
<text x="462.0" y="162.8" font-size="11.5" fill="#9198a1" text-anchor="end">0.5</text>
<path d="M466 57.6 H470" stroke="#8b949e"/>
<text x="462.0" y="61.6" font-size="11.5" fill="#9198a1" text-anchor="end">1</text>
<path d="M470.0 260 V264" stroke="#8b949e"/>
<text x="470.0" y="278.0" font-size="11.5" fill="#9198a1" text-anchor="middle">0</text>
<path d="M585.0 260 V264" stroke="#8b949e"/>
<text x="585.0" y="278.0" font-size="11.5" fill="#9198a1" text-anchor="middle">1,000</text>
