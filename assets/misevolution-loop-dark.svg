<text x="436" y="150.0" font-size="12" fill="#9198a1" text-anchor="middle" transform="rotate(-90 436 150.0)">rate</text>
<path d="M498.8 63.1 L527.5 57.6 L556.2 57.6 L585.0 57.6 L613.8 57.6 L642.5 57.6 L671.2 57.6 L700.0 57.6" fill="none" stroke="#3987e5" stroke-width="2.2"/>
<path d="M498.8 236.4 L527.5 260.0 L556.2 260.0 L585.0 260.0 L613.8 260.0 L642.5 260.0 L671.2 260.0 L700.0 260.0" fill="none" stroke="#ff7b72" stroke-width="2.2"/>
<rect x="530" y="116.39999999999998" width="160" height="48" fill="#0d1117" stroke="#30363d"/>
<path d="M540 128.39999999999998 H562" stroke="#3987e5" stroke-width="2.2"/>
<text x="570.0" y="132.4" font-size="12" fill="#e6edf3">utility</text>
<path d="M540 148.39999999999998 H562" stroke="#ff7b72" stroke-width="2.2"/>
<text x="570.0" y="152.4" font-size="12" fill="#e6edf3">safety</text>
<rect x="770" y="34" width="245" height="65" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
<text x="782.0" y="56.0" font-size="13" fill="#e6edf3" font-weight="700">Your Agent May Misevolve</text>
<text x="782.0" y="73.0" font-size="12.5" fill="#9198a1">Refusal rates drop</text>
<text x="782.0" y="90.0" font-size="12.5" fill="#9198a1">after self-training</text>
<rect x="770" y="109" width="245" height="82" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
<text x="782.0" y="131.0" font-size="13" fill="#e6edf3" font-weight="700">Appreciation Teaches</text>
<text x="782.0" y="148.0" font-size="13" fill="#e6edf3" font-weight="700">Unauthorized Execution</text>
<text x="782.0" y="165.0" font-size="12.5" fill="#9198a1">Learning from user feedback</text>
<text x="782.0" y="182.0" font-size="12.5" fill="#9198a1">raises hidden-injection success</text>
<rect x="770" y="201" width="245" height="65" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
<text x="782.0" y="223.0" font-size="13" fill="#e6edf3" font-weight="700">Masked Erosion</text>
<text x="782.0" y="240.0" font-size="12.5" fill="#9198a1">Redundant safeguards erode,</text>
<text x="782.0" y="257.0" font-size="12.5" fill="#9198a1">unseen by the acceptance gate</text>
<text x="180.0" y="331.0" font-size="13.5" fill="#e6edf3" text-anchor="middle">(a) The feedback loop</text>
<text x="585.0" y="331.0" font-size="13.5" fill="#e6edf3" text-anchor="middle">(b) Simulated agent, no defense</text>
<text x="892.0" y="331.0" font-size="13.5" fill="#e6edf3" text-anchor="middle">(c) Observed in real agents</text>
</g>
</svg>
